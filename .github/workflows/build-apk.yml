name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk PolarPop.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PolarPop-apk
          path: PolarPop.apk

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: POLAR POP build ${{ github.run_number }}
          body: Debug APK built from ${{ github.sha }}. Download PolarPop.apk below and open it on your Android device.
          files: PolarPop.apk
